<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniTracker - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 222.2 84% 4.9%;
            --card: 0 0% 100%;
            --card-foreground: 222.2 84% 4.9%;
            --primary: 222.2 47.4% 11.2%;
            --primary-foreground: 210 40% 98%;
            --secondary: 210 40% 96.1%;
            --secondary-foreground: 222.2 47.4% 11.2%;
            --muted: 210 40% 96.1%;
            --muted-foreground: 215.4 16.3% 46.9%;
            --border: 214.3 31.8% 91.4%;
            --radius: 0.5rem;
        }
        body {
            background: hsl(var(--background));
            color: hsl(var(--foreground));
        }
        .card {
            background: hsl(var(--card));
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
        }
        .btn-primary {
            background: linear-gradient(to right, #2563eb, #9333ea);
            color: white;
        }
        .btn-primary:hover {
            background: linear-gradient(to right, #1d4ed8, #7c3aed);
        }
        .progress-bar {
            background: linear-gradient(to right, #10b981, #3b82f6);
            height: 8px;
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-in-progress { background: #fef3c7; color: #92400e; }
        .status-submitted { background: #d1fae5; color: #047857; }
        .status-not-started { background: #fee2e2; color: #dc2626; }
        .status-under-review { background: #dbeafe; color: #1d4ed8; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50">
    <!-- Header -->
    <header class="sticky top-0 z-40 flex h-16 shrink-0 items-center justify-center border-b bg-white/80 backdrop-blur-sm px-4">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-2 rounded-lg">
                <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
                    UniTracker
                </h1>
                <p class="text-sm text-gray-500">Smart Application Management</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 lg:p-6 pb-20 sm:pb-24">
        <div class="space-y-6">
            <!-- Stats Overview -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="card p-6">
                    <div class="flex items-center">
                        <div class="p-2 bg-blue-100 rounded-lg mr-3">
                            <svg class="h-6 w-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        </div>
                        <div>
                            <h3 class="text-2xl font-bold">4</h3>
                            <p class="text-sm text-gray-500">Total Applications</p>
                        </div>
                    </div>
                </div>
                <div class="card p-6">
                    <div class="flex items-center">
                        <div class="p-2 bg-green-100 rounded-lg mr-3">
                            <svg class="h-6 w-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                        <div>
                            <h3 class="text-2xl font-bold">2</h3>
                            <p class="text-sm text-gray-500">Submitted</p>
                        </div>
                    </div>
                </div>
                <div class="card p-6">
                    <div class="flex items-center">
                        <div class="p-2 bg-yellow-100 rounded-lg mr-3">
                            <svg class="h-6 w-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <div>
                            <h3 class="text-2xl font-bold">1</h3>
                            <p class="text-sm text-gray-500">In Progress</p>
                        </div>
                    </div>
                </div>
                <div class="card p-6">
                    <div class="flex items-center">
                        <div class="p-2 bg-red-100 rounded-lg mr-3">
                            <svg class="h-6 w-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 18.5c-.77.833.192 2.5 1.732 2.5z"></path>
                            </svg>
                        </div>
                        <div>
                            <h3 class="text-2xl font-bold">1</h3>
                            <p class="text-sm text-gray-500">Not Started</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Deadline Alert -->
            <div class="bg-red-50 border border-red-200 rounded-xl p-4">
                <div class="flex items-center">
                    <svg class="h-5 w-5 text-red-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 18.5c-.77.833.192 2.5 1.732 2.5z"></path>
                    </svg>
                    <h3 class="font-semibold text-red-800">Upcoming Deadlines</h3>
                </div>
                <p class="text-red-700 mt-1">Harvard University deadline is in 3 days (Jan 10, 2024)</p>
            </div>

            <!-- Main Content Grid -->
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                <!-- Applications List -->
                <div class="xl:col-span-2">
                    <div class="card overflow-hidden">
                        <div class="p-4 lg:p-6 border-b border-gray-200">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                                <h2 class="text-xl font-semibold text-gray-900">My Applications</h2>
                                <button class="btn border px-4 py-2 rounded-lg text-sm">
                                    <svg class="h-4 w-4 mr-2 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
                                    </svg>
                                    Filter
                                </button>
                            </div>
                            
                            <div class="relative lg:hidden">
                                <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                                <input class="pl-10 w-full border rounded-lg px-3 py-2" placeholder="Search universities or programs..." />
                            </div>
                        </div>

        <div class="divide-y divide-gray-200" id="applications-list">
            <!-- Applications will be populated by JavaScript -->
        </div>
                    </div>
                </div>

                <!-- Application Steps Panel -->
                <div class="xl:col-span-1">
                    <div class="card overflow-hidden sticky top-6" id="application-steps">
                        <!-- Steps will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Floating Bottom Navigation -->
    <div class="fixed bottom-3 sm:bottom-4 left-1/2 transform -translate-x-1/2 z-50 px-4 w-full max-w-sm">
        <div class="bg-white/90 backdrop-blur-md rounded-xl sm:rounded-2xl shadow-lg border border-gray-200 p-1.5 sm:p-2">
            <div class="flex items-center justify-between space-x-1 sm:space-x-2">
                <a href="index.html" class="flex flex-col items-center justify-center p-2 sm:p-3 rounded-lg sm:rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-md flex-1">
                    <svg class="h-4 w-4 sm:h-5 sm:w-5 mb-0.5 sm:mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    <span class="text-xs font-medium">Dashboard</span>
                </a>
                <a href="applications.html" class="flex flex-col items-center justify-center p-2 sm:p-3 rounded-lg sm:rounded-xl text-gray-600 hover:bg-gray-100 flex-1">
                    <svg class="h-4 w-4 sm:h-5 sm:w-5 mb-0.5 sm:mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    <span class="text-xs font-medium">Applications</span>
                </a>
                <a href="#" class="flex flex-col items-center justify-center p-2 sm:p-3 rounded-lg sm:rounded-xl text-gray-600 hover:bg-gray-100 flex-1">
                    <svg class="h-4 w-4 sm:h-5 sm:w-5 mb-0.5 sm:mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                    </svg>
                    <span class="text-xs font-medium">Analytics</span>
                </a>
                <a href="#" class="flex flex-col items-center justify-center p-2 sm:p-3 rounded-lg sm:rounded-xl text-gray-600 hover:bg-gray-100 flex-1">
                    <svg class="h-4 w-4 sm:h-5 sm:w-5 mb-0.5 sm:mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span class="text-xs font-medium">Settings</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // Application data
        const applications = [
            {
                id: 1,
                university: "Stanford University",
                program: "Computer Science",
                deadline: "2024-01-15",
                status: "In Progress",
                progress: 65,
                requirements: ["Personal Statement", "Transcripts", "Letters of Rec", "Test Scores"],
                completed: ["Transcripts", "Test Scores"]
            },
            {
                id: 2,
                university: "MIT",
                program: "Electrical Engineering",
                deadline: "2024-01-01",
                status: "Submitted",
                progress: 100,
                requirements: ["Personal Statement", "Transcripts", "Letters of Rec", "Portfolio"],
                completed: ["Personal Statement", "Transcripts", "Letters of Rec", "Portfolio"]
            },
            {
                id: 3,
                university: "UC Berkeley",
                program: "Data Science",
                deadline: "2024-02-01",
                status: "Not Started",
                progress: 0,
                requirements: ["Personal Statement", "Transcripts", "Letters of Rec"],
                completed: []
            },
            {
                id: 4,
                university: "Harvard University",
                program: "Business Administration",
                deadline: "2024-01-10",
                status: "Under Review",
                progress: 100,
                requirements: ["Personal Statement", "Transcripts", "Letters of Rec", "Interview"],
                completed: ["Personal Statement", "Transcripts", "Letters of Rec", "Interview"]
            }
        ];

        let selectedApplication = applications[0];

        function getStatusClass(status) {
            const statusMap = {
                "In Progress": "status-in-progress",
                "Submitted": "status-submitted",
                "Not Started": "status-not-started",
                "Under Review": "status-under-review"
            };
            return statusMap[status] || "status-not-started";
        }

        function getStatusIcon(status) {
            const icons = {
                "Submitted": '<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>',
                "In Progress": '<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>',
                "Under Review": '<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>',
                "Not Started": '<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 18.5c-.77.833.192 2.5 1.732 2.5z"></path></svg>'
            };
            return icons[status] || icons["Not Started"];
        }

        function isUrgent(deadline) {
            const deadlineDate = new Date(deadline);
            const today = new Date();
            const diffTime = deadlineDate.getTime() - today.getTime();
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays <= 7 && diffDays > 0;
        }

        function formatDeadline(deadline) {
            const date = new Date(deadline);
            const today = new Date();
            const diffTime = date.getTime() - today.getTime();
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) return "Overdue";
            if (diffDays === 0) return "Due Today";
            if (diffDays === 1) return "Due Tomorrow";
            if (diffDays <= 7) return `${diffDays} days left`;
            return date.toLocaleDateString();
        }

        function renderApplications() {
            const container = document.getElementById('applications-list');
            container.innerHTML = applications.map(app => `
                <div class="p-6 hover:bg-gray-50 transition-all duration-200 cursor-pointer border-l-4 ${
                    selectedApplication.id === app.id ? 'bg-blue-50 border-l-blue-500' : 'border-l-transparent'
                } ${isUrgent(app.deadline) ? 'bg-red-50' : ''}" 
                     onclick="selectApplication(${app.id})">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex-1 min-w-0">
                            <h3 class="text-lg font-semibold text-gray-900 mb-1 truncate">
                                ${app.university}
                            </h3>
                            <div class="flex items-center text-sm text-gray-600 mb-2">
                                <svg class="h-4 w-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg>
                                ${app.program}
                            </div>
                        </div>
                        
                        <span class="status-badge ${getStatusClass(app.status)} flex items-center gap-1 px-3 py-1">
                            ${getStatusIcon(app.status)}
                            ${app.status}
                        </span>
                    </div>

                    <div class="mb-4">
                        <div class="flex items-center justify-between text-sm mb-2">
                            <span class="text-gray-600">Progress</span>
                            <span class="font-medium text-gray-900">${app.progress}%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div class="progress-bar h-2 rounded-full" style="width: ${app.progress}%"></div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center text-sm">
                            <svg class="h-4 w-4 mr-1 ${isUrgent(app.deadline) ? 'text-red-500' : 'text-gray-400'}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                            <span class="${isUrgent(app.deadline) ? 'text-red-600 font-medium' : 'text-gray-600'}">
                                ${formatDeadline(app.deadline)}
                            </span>
                        </div>
                        
                        <div class="text-xs text-gray-500">
                            ${app.completed.length} of ${app.requirements.length} completed
                        </div>
                    </div>

                    ${isUrgent(app.deadline) ? `
                        <div class="mt-3 p-2 bg-red-100 border border-red-200 rounded-lg">
                            <p class="text-xs text-red-800 font-medium">
                                ⚠️ Deadline approaching! Complete remaining requirements soon.
                            </p>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function renderApplicationSteps() {
            const container = document.getElementById('application-steps');
            if (!selectedApplication) return;

            container.innerHTML = `
                <div class="p-6 border-b border-gray-200">
                    <h3 class="font-semibold text-gray-900">Application Steps</h3>
                    <p class="text-sm text-gray-600">${selectedApplication.university}</p>
                </div>
                <div class="p-6 space-y-4">
                    ${selectedApplication.requirements.map(req => `
                        <div class="flex items-center justify-between p-3 border rounded-lg ${selectedApplication.completed.includes(req) ? 'bg-green-50 border-green-200' : 'bg-gray-50'}">
                            <div class="flex items-center">
                                ${selectedApplication.completed.includes(req) ? 
                                    '<svg class="h-5 w-5 text-green-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' :
                                    '<div class="w-5 h-5 border-2 border-gray-300 rounded-full mr-3"></div>'
                                }
                                <span class="text-sm ${selectedApplication.completed.includes(req) ? 'text-green-800' : 'text-gray-700'}">${req}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function selectApplication(id) {
            selectedApplication = applications.find(app => app.id === id);
            renderApplications();
            renderApplicationSteps();
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            renderApplications();
            renderApplicationSteps();
        });
    </script>
</body>
</html>
